<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn từ vựng — Msutong Trung cấp 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --rice:#f1e8d6; --paper:#fcf8f0; --paper-2:#f7efdf;
  --line:#dccbab; --line-soft:#e9dcc2;
  --ink:#282320; --ink-2:#4b423a; --soft:#7c7164;
  --brass:#a07b36; --brass-d:#7d5d24; --brass-l:#dcc38b; --brass-t:#f6ecd6;
  --seal:#9b2f2a; --seal-t:#f8e7e3;
  --olive:#5f6b3e; --olive-t:#eef1e1;
  --tz:44px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--rice);color:var(--ink);font-family:'Noto Sans SC',sans-serif;line-height:1.62;padding-bottom:56px;}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.hz{font-family:'Noto Serif SC',serif;font-weight:700;}
.py{font-family:'IBM Plex Mono',monospace;font-size:.86em;color:var(--brass-d);letter-spacing:-.2px;}
.mono{font-family:'IBM Plex Mono',monospace;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:2.4px;text-transform:uppercase;color:var(--soft);}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:700;margin:0;line-height:1.2;}
.wrap{max-width:820px;margin:0 auto;padding:0 15px;}

/* ---------- hero ---------- */
.hero{background:var(--ink);color:#efe4cd;padding:30px 15px 60px;text-align:center;position:relative;}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--brass),transparent);}
.hero .eyebrow{color:var(--brass-l);}
.hero .art{color:var(--brass-l);margin:2px 0 6px;}
.hero .art svg{width:58px;height:58px;}
.hero h1{font-family:'Fraunces',serif;font-size:2.1rem;font-weight:700;margin-top:6px;letter-spacing:1px;}
.hero .sub{font-size:.86rem;opacity:.66;margin-top:5px;font-family:'IBM Plex Mono',monospace;}

.headcard{background:var(--paper);border:1px solid var(--line);margin-top:-42px;padding:18px 18px 16px;text-align:center;box-shadow:0 6px 22px rgba(40,35,32,.13);position:relative;}
.headcard .n{font-family:'Fraunces',serif;font-size:1.5rem;}
.headcard .n b{color:var(--brass-d);}
.headcard .note{font-size:.83rem;color:var(--soft);margin-top:4px;}
.headcard .note b{color:var(--brass-d);}

/* ---------- danh sách bài ---------- */
.list{margin-top:26px;}
.lesson{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);padding:15px 16px;
        margin-bottom:12px;text-decoration:none;color:inherit;transition:.14s;}
.lesson:last-child{margin-bottom:0;}
.lesson:hover{background:var(--brass-t);border-color:var(--brass);}
.lesson .iconbox{flex:0 0 auto;width:50px;height:50px;border:1px solid var(--line);background:var(--paper-2);display:grid;place-items:center;color:var(--brass-d);}
.lesson .iconbox svg{width:26px;height:26px;}
.lesson:hover .iconbox{border-color:var(--brass);background:var(--brass-t);}
.lesson .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.lesson .tag{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--soft);letter-spacing:1.4px;text-transform:uppercase;}
.lesson .hzline{font-family:'Noto Serif SC',serif;font-weight:700;font-size:1.15rem;line-height:1.3;overflow-wrap:anywhere;}
.lesson .vi{font-size:.86rem;color:var(--ink-2);}
.lesson .meta{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--soft);margin-top:3px;letter-spacing:.3px;}
.lesson .arrow{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;color:var(--soft);font-size:1.1rem;transition:.14s;}
.lesson:hover .arrow{color:var(--brass-d);transform:translateX(3px);}

footer{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--soft);padding:30px 15px 0;letter-spacing:.4px;}

@media(max-width:480px){
  .hero h1{font-size:1.7rem;}
  .lesson{padding:13px 12px;gap:11px;}
  .lesson .iconbox{width:44px;height:44px;}
  .lesson .iconbox svg{width:22px;height:22px;}
  .lesson .hzline{font-size:1.04rem;}
}
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow">Vanla · HSK4 ôn tập</div>
  <div class="art"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 15v34"/>
    <path d="M32 15c-6-3.5-16-4.5-24-1v33c8-3.5 18-2.5 24 1"/>
    <path d="M32 15c6-3.5 16-4.5 24-1v33c-8-3.5-18-2.5-24 1"/>
    <path d="M12 23h13M12 29h13M12 35h9"/>
    <path d="M39 23h13M39 29h13M39 35h9"/>
  </svg></div>
  <h1>速通汉语 中级 1</h1>
  <div class="sub">Msutong Trung cấp 1</div>
</header>

<div class="wrap">
  <div class="headcard">
    <div class="n">Chọn bài để ôn từ vựng</div>
    <div class="note">Hiện có <b id="lessonCount"></b> · mỗi bài có 6-8 cách ôn, tự chấm điểm, lưu tiến độ ngay trên máy.</div>
  </div>

  <div class="list" id="list"></div>
</div>

<footer>Msutong Trung cấp 1 · Mục lục bài học</footer>

<script>
/* Trang tĩnh, không tự dò thư mục được (mở bằng file://) — mỗi khi tạo bai[N]-on-tu-vung.html mới,
   thêm một dòng vào LESSONS bên dưới, kèm icon SVG gợi chủ đề bài (chọn 1 trong ICONS hoặc vẽ mới). */
const ICONS={
  /* bát cơm bốc khói + đũa — chủ đề gọi món, ẩm thực */
  bowl:'<path d="M3.5 11h17"/><path d="M3.5 11a8.5 5 0 0 0 17 0"/><path d="M9.5 11a2.5 3 0 0 1 5 0"/><path d="M11 3c0 1-1 1.2-1 2.2S11 6.4 11 7.4"/>',
  /* bong bóng thoại + hai gạch chữ — chủ đề nói năng, thành ngữ / tục ngữ */
  quote:'<path d="M3 5h18v10H10l-4.5 4v-4H3z"/><path d="M7 9h10M7 12.5h6"/>',
  /* người đang chạy — chủ đề thể thao, vận động */
  run:'<circle cx="15.5" cy="5" r="1.8"/><path d="M9 21l2.2-5 2-2-1-4"/><path d="M8 12l3.5-2.5 2.7 1.8 3.3-1"/><path d="M11.2 9.5 9 7l-4 1.5"/><path d="M13.2 14l3.3 1.5 2-3"/>',
  /* vali kéo có tay cầm — chủ đề du lịch, đi lại */
  bag:'<path d="M7 8V6a5 5 0 0 1 10 0v2"/><rect x="4.5" y="8" width="15" height="12" rx="2"/><path d="M9.5 12v4M14.5 12v4"/>',
  /* điện thoại thông minh với sóng âm — chủ đề điện thoại, mất/tìm đồ */
  phone:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M10.5 18.5h3"/><path d="M4 9.5a9 9 0 0 1 1.8-3.2M20 9.5a9 9 0 0 0-1.8-3.2"/>',
  /* hộp quà có nơ — chủ đề tặng quà, tình cảm */
  gift:'<rect x="3.5" y="9.5" width="17" height="11" rx="1"/><path d="M3.5 13.5h17"/><path d="M12 9.5v11"/><path d="M12 9.5c-1.6-3.4-6-3.6-6-1S8.6 9.5 12 9.5Z"/><path d="M12 9.5c1.6-3.4 6-3.6 6-1S15.4 9.5 12 9.5Z"/>',
  /* khuôn mặt cười — chủ đề nụ cười, sức mạnh tinh thần */
  smile:'<circle cx="12" cy="12" r="9"/><path d="M8 13.5c.9 1.6 2.3 2.5 4 2.5s3.1-.9 4-2.5"/><path d="M8.5 9.5h.01M15.5 9.5h.01"/>'
};
const LESSONS=[
 {n:1,icon:"bowl",hz:"来几个家常菜吧",vi:"Làm vài món ăn nhà nhé",meta:"36 từ · 42 cụm cố định",file:"bai1-on-tu-vung.html"},
 {n:2,icon:"quote",hz:"说曹操，曹操到",vi:"Nhắc Tào Tháo, Tào Tháo đến",meta:"72 từ · 67 cụm cố định",file:"bai2-on-tu-vung.html"},
 {n:3,icon:"run",hz:"我们爱运动",vi:"Chúng ta yêu thể thao",meta:"86 từ · 70 cụm cố định · 6 cách ôn",file:"bai3-on-tu-vung.html"},
 {n:4,icon:"bag",hz:"自助游",vi:"Du lịch tự túc",meta:"52 từ · 50 cụm cố định",file:"bai4-on-tu-vung.html"},
 {n:5,icon:"phone",hz:"手机怎么了",vi:"Điện thoại bị làm sao vậy?",meta:"43 từ · 46 cụm cố định · 6 cách ôn",file:"bai5-on-tu-vung.html"},
 {n:6,icon:"gift",hz:"爱的礼物",vi:"Món quà tình yêu",meta:"47 từ · 69 cụm cố định · 8 cách ôn",file:"bai6-on-tu-vung.html"},
 {n:7,icon:"smile",hz:"微笑的力量",vi:"Sức mạnh của nụ cười",meta:"51 từ · 58 cụm cố định · 8 cách ôn",file:"bai7-on-tu-vung.html"}
];
const NUM=["","一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五"];
document.getElementById('lessonCount').textContent=LESSONS.length+' bài';
document.getElementById('list').innerHTML=LESSONS.map(l=>
  '<a class="lesson" href="'+l.file+'">'+
    '<span class="iconbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">'+ICONS[l.icon]+'</svg></span>'+
    '<span class="body">'+
      '<span class="tag">第'+(NUM[l.n]||l.n)+'课</span>'+
      '<span class="hzline">'+l.hz+'</span>'+
      '<span class="vi">'+l.vi+'</span>'+
      '<span class="meta">'+l.meta+'</span>'+
    '</span>'+
    '<span class="arrow">→</span>'+
  '</a>'
).join('');
</script>
</body>
</html>
